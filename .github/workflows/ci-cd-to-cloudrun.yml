name: ci-cd to cloudrun

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: ["cloudrun"]
  pull_request:
    branches: ["cloudrun"]

env:
  REPO: ${{ secrets.GKE_ARTIFACT_REPOSITORY }}
  IMAGE: backstage

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24   # safer LTS for Backstage
          cache: yarn

      - name: Install Dependencies
        # run: yarn install --frozen-lockfile
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

      # - name: Auto-commit updated yarn.lock
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: "chore(ci): auto-update yarn.lock"
      #     file_pattern: "yarn.lock"

      - name: Compile TypeScript
        run: yarn tsc

      - name: Run Unit Tests
        run: yarn test:all

      - name: Build the application
        run: yarn build:all

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist

  image-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GKE_REGION }}-docker.pkg.dev

    #   - name: Create Artifact Registry repo if not exists
    #     run: |
    #       gcloud artifacts repositories describe ${{ env.REPO }} \
    #         --project=${{ secrets.GCP_PROJECT_ID }} \
    #         --location=${{ secrets.GKE_REGION }} || \
    #       gcloud artifacts repositories create ${{ env.REPO }} \
    #         --repository-format=docker \
    #         --location=${{ secrets.GKE_REGION }} \
    #         --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            -f packages/backend/Dockerfile .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}
        
  deploy:
    runs-on: ubuntu-latest
    needs: image-build
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  
      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}  # Use the GCP project ID stored in secrets
        run: |
          gcloud run deploy backstage \
            --image ${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ secrets.GKE_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project $GCP_PROJECT_ID \
            --memory 1Gi \
            --port 7007 \
            --set-env-vars NODE_ENV=production